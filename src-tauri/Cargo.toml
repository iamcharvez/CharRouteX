[package]
name = "charroutex"
version.workspace = true
description = "Your Network. Your Control."
authors = ["CharRouteX Contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "charroutex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4.28"
chrono.workspace = true
network-core.workspace = true
network-protocol.workspace = true
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde.workspace = true
serde_json = "1.0.145"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.9"
tauri = { version = "2.12.4", features = ["tray-icon", "image-ico"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-single-instance = "2.4.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "sync"] }
tracing.workspace = true
windows-network = { path = "../crates/windows-network" }
uuid = { version = "1.18.1", features = ["v4"] }
webpki-roots = "1.0.4"

[target.'cfg(windows)'.dependencies]
windows.workspace = true

